<title>ASTRA//SIGNATURE</title>
<style>html,body{margin:0;min-height:100%;background:#040405;color:#eae4d8;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot b{font:600 18px Georgia,serif;letter-spacing:.08em;color:#d8c49a}.boot small{display:block;margin-top:10px;opacity:.65}</style>
</head>
<body>
<div class="boot" id="boot"><div><b>ASTRA//SIGNATURE</b><small>INITIALIZING CELESTIAL ENGINE</small></div></div>
<noscript><div class="boot"><div><b>ASTRA//SIGNATURE</b><small>JavaScript is required to calculate and render the chart.</small></div></div></noscript>
<script>
/* app.html is the complete public instrument. This loader injects it verbatim,
   then installs entry-point validation that prevents a manually entered
   location from being silently interpreted as UTC when no time zone was
   explicitly chosen. No birth data is transmitted by this guard. */
function installLaunchGuards(){
  document.addEventListener('submit',function(e){
    if(!e.target || e.target.id!=='birthForm') return;
    const tz=document.getElementById('tz');
    if(tz && !tz.value){
      e.preventDefault();
      e.stopImmediatePropagation();
      const err=document.getElementById('formError');
      if(err){
        err.style.display='block';
        err.textContent='Choose a time zone for this location.';
      }
      try{ tz.focus({preventScroll:true}); }catch(_){ tz.focus(); }
    }
  },true);
}
(async()=>{
  try{
    const app=await (await fetch('./app.html',{cache:'no-store'})).text();
    document.open();document.write(app);document.close();
    installLaunchGuards();
  }catch(err){
    const boot=document.getElementById('boot');
    if(boot) boot.innerHTML='<div><b>ASTRA//SIGNATURE</b><small>Unable to load the celestial engine. Refresh to try again.</small></div>';
    console.error(err);
  }
})();
</script>
</body>
