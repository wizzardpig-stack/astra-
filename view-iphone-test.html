<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050607" />
<title>VIEW V1.2 iPhone RC</title>
<style>
  :root {
    --fg: rgba(255,255,255,.94);
    --muted: rgba(255,255,255,.56);
    --hair: rgba(255,255,255,.18);
    --ui-shadow: 0 1px 18px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; min-height:100%; margin:0; background:#050607; overflow:hidden; overscroll-behavior:none; }
  @supports (height:100dvh) { html, body { height:100dvh; min-height:100dvh; } }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  button:focus-visible { outline: 1px solid rgba(255,255,255,.8); outline-offset: 4px; }

  #app { width:100%; height:100%; min-height:100%; position:relative; background:#050607; }
  @supports (height:100dvh) { #app { height:100dvh; min-height:100dvh; } }

  /* WORLD SELECTOR */
  #selector {
    position:absolute; inset:0; z-index:20; display:grid; grid-template-columns:repeat(4,1fr);
    background:#050607; transition:opacity 900ms ease, visibility 900ms ease;
  }
  #selector.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .selector-brand {
    position:absolute; z-index:8; left:clamp(18px,3vw,48px); top:clamp(18px,3vw,40px);
    font-size:12px; font-weight:560; letter-spacing:.14em; text-transform:uppercase;
    text-shadow:var(--ui-shadow); pointer-events:none;
  }
  .selector-sub {
    position:absolute; z-index:8; left:clamp(18px,3vw,48px); bottom:clamp(18px,3vw,40px);
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.55);
    text-shadow:var(--ui-shadow); pointer-events:none;
  }
  .world-tile {
    position:relative; border:0; padding:0; overflow:hidden; cursor:pointer; background:#111; isolation:isolate;
    border-right:1px solid rgba(255,255,255,.10);
  }
  .world-tile:last-child { border-right:0; }
  .world-tile::before {
    content:""; position:absolute; inset:-4%; z-index:-1; background-image:var(--tile-img);
    background-position:center; background-size:cover; transform:scale(1.04);
    transition:transform 4s cubic-bezier(.16,.84,.2,1), filter 800ms ease;
    animation:selectorDrift 18s ease-in-out infinite alternate;
  }
  .world-tile::after {
    content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.58), rgba(0,0,0,.04) 55%, rgba(0,0,0,.12));
    transition:background 600ms ease;
  }
  .world-tile:hover::before, .world-tile:focus-visible::before { transform:scale(1.10); filter:saturate(1.08) contrast(1.03); }
  .world-tile:hover::after { background:linear-gradient(to top, rgba(0,0,0,.48), rgba(0,0,0,.01) 58%, rgba(0,0,0,.06)); }
  .tile-label {
    position:absolute; left:clamp(14px,2vw,28px); bottom:clamp(18px,3vw,42px); z-index:4;
    font-size:clamp(11px,1vw,14px); letter-spacing:.08em; font-weight:520; text-transform:uppercase;
    text-shadow:var(--ui-shadow); opacity:.75; transform:translateY(4px); transition:opacity 450ms ease, transform 450ms ease;
  }
  .world-tile:hover .tile-label, .world-tile:focus-visible .tile-label { opacity:1; transform:translateY(0); }
  @keyframes selectorDrift { from{ transform:scale(1.045) translate3d(-.8%,0,0);} to{ transform:scale(1.085) translate3d(.8%,-.6%,0);} }

  /* ENVIRONMENT */
  #viewer { position:absolute; inset:0; z-index:1; overflow:hidden; background:#060708; animation:metaFloat 18s ease-in-out infinite alternate; transform-origin:center center; }
  body.flow-active #viewer { filter:url(#metaFluidDisplace); animation:hyperFloat 4.8s ease-in-out infinite alternate; }
  body.flow-active #gl, body.flow-active #camWrap { animation:hyperBreath 3.6s ease-in-out infinite alternate; }
  body.flow-active #overlayFx::before { opacity:.16; animation:hyperPlasma 4.4s ease-in-out infinite alternate; }
  body.flow-active #overlayFx::after { opacity:.11; animation:hyperPlasma2 5.2s ease-in-out infinite alternate; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; transform-origin:center center; animation:metaBreath 14s ease-in-out infinite alternate; }
  body.fallback #gl { display:none; }

  /* CSS fallback compositor (only used when WebGL is unavailable) */
  #camWrap { position:absolute; inset:0; display:none; will-change:transform; transform-origin:center center; animation:metaBreath 14s ease-in-out infinite alternate; }
  body.fallback #camWrap { display:block; }
  .scene-layer { position:absolute; inset:-4%; background-size:cover; background-position:center; will-change:transform, opacity, filter; }
  #layerA { opacity:1; }
  .b-band { position:absolute; inset:-4%; background-size:cover; background-position:center; opacity:0; }
  #bFar  { -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 34%, transparent 56%); mask-image:linear-gradient(to bottom, #000 0%, #000 34%, transparent 56%); }
  #bMid  { -webkit-mask-image:linear-gradient(to bottom, transparent 22%, #000 44%, #000 66%, transparent 84%); mask-image:linear-gradient(to bottom, transparent 22%, #000 44%, #000 66%, transparent 84%); }
  #bNear { -webkit-mask-image:linear-gradient(to bottom, transparent 52%, #000 76%, #000 100%); mask-image:linear-gradient(to bottom, transparent 52%, #000 76%, #000 100%); }

  #overlayFx { position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden; display:block; mix-blend-mode:screen; }
  #overlayFx::before, #overlayFx::after { content:""; position:absolute; inset:-12%; transition:opacity 1600ms ease; }
  #overlayFx::before { opacity:.08; background:radial-gradient(circle at 18% 28%, rgba(255,255,255,.12), transparent 18%), radial-gradient(circle at 76% 24%, rgba(129,191,255,.08), transparent 20%), radial-gradient(circle at 52% 72%, rgba(255,176,120,.06), transparent 22%), linear-gradient(135deg, rgba(255,255,255,.03), transparent 40%); filter:blur(30px); animation:metaPlasma 19s ease-in-out infinite alternate; }
  #overlayFx::after { opacity:.055; background:radial-gradient(circle at 30% 65%, rgba(140,165,255,.16), transparent 20%), radial-gradient(circle at 78% 70%, rgba(255,255,255,.12), transparent 18%), radial-gradient(circle at 50% 35%, rgba(255,130,205,.08), transparent 18%); filter:blur(42px); mix-blend-mode:soft-light; animation:metaPlasma2 23s ease-in-out infinite alternate; }
  body.fallback[data-world="veil"] #overlayFx::before {
    opacity:.23; background:
      radial-gradient(ellipse at 25% 50%, rgba(255,255,255,.24), transparent 34%),
      radial-gradient(ellipse at 72% 36%, rgba(255,255,255,.18), transparent 33%),
      linear-gradient(120deg, rgba(255,255,255,.08), transparent 40%);
    filter:blur(34px); animation:fogFloat 26s ease-in-out infinite alternate;
  }
  body.fallback[data-world="abyss"] #overlayFx::before {
    opacity:.18; background:
      radial-gradient(circle at 24% 10%, rgba(123,216,255,.36), transparent 16%),
      radial-gradient(circle at 78% 5%, rgba(117,205,255,.18), transparent 18%),
      repeating-linear-gradient(98deg, rgba(160,225,255,.06) 0 1px, transparent 1px 60px);
    filter:blur(18px); animation:caustic 18s ease-in-out infinite alternate;
  }
  body.fallback[data-world="orbit"] #overlayFx::after {
    opacity:.36; background:radial-gradient(circle at 50% 45%, transparent 35%, rgba(0,0,0,.48) 100%);
  }
  body.fallback[data-world="beach"] #overlayFx::after {
    opacity:.16; background:linear-gradient(to top, rgba(255,151,79,.18), transparent 42%);
    mix-blend-mode:screen;
  }
  @keyframes fogFloat { from{ transform:translate3d(-2%,1%,0) scale(1.02);} to{ transform:translate3d(3%,-2%,0) scale(1.08);} }
  @keyframes caustic { from{ transform:translate3d(-2%,-1%,0) rotate(-1deg);} to{ transform:translate3d(3%,2%,0) rotate(1deg);} }
  @keyframes metaFloat { from{ transform:scale(1.012) translate3d(-0.45%, -0.28%, 0);} to{ transform:scale(1.026) translate3d(0.55%, 0.42%, 0);} }
  @keyframes metaBreath { from{ transform:scale(1.015) rotate(-0.18deg);} to{ transform:scale(1.032) rotate(0.22deg);} }
  @keyframes metaPlasma { from{ transform:translate3d(-1.5%,0.8%,0) rotate(-1.1deg) scale(1.02);} to{ transform:translate3d(1.8%,-1.2%,0) rotate(1.25deg) scale(1.08);} }
  @keyframes metaPlasma2 { from{ transform:translate3d(1.2%,-0.6%,0) rotate(0.8deg) scale(1.03);} to{ transform:translate3d(-1.6%,1.4%,0) rotate(-1deg) scale(1.09);} }
  @keyframes hyperFloat { 0%{ transform:scale(1.035) translate3d(-.8%,-.45%,0) rotate(-.22deg);} 50%{ transform:scale(1.05) translate3d(.35%,.55%,0) rotate(.14deg);} 100%{ transform:scale(1.04) translate3d(.85%,-.15%,0) rotate(.26deg);} }
  @keyframes hyperBreath { 0%{ transform:scale(1.025) rotate(-.28deg);} 45%{ transform:scale(1.055) rotate(.18deg);} 100%{ transform:scale(1.035) rotate(.31deg);} }
  @keyframes hyperPlasma { 0%{ transform:translate3d(-4%,2%,0) rotate(-3deg) scale(1.08);} 50%{ transform:translate3d(2%,-3%,0) rotate(1deg) scale(1.16);} 100%{ transform:translate3d(4%,2%,0) rotate(3deg) scale(1.11);} }
  @keyframes hyperPlasma2 { 0%{ transform:translate3d(3%,-2%,0) rotate(2deg) scale(1.12);} 50%{ transform:translate3d(-3%,3%,0) rotate(-2deg) scale(1.18);} 100%{ transform:translate3d(-1%,-3%,0) rotate(1deg) scale(1.10);} }

  .vignette { position:absolute; inset:0; z-index:4; pointer-events:none; background:radial-gradient(circle at center, transparent 62%, rgba(0,0,0,.18) 100%); }

  /* UI */
  #hud { position:absolute; inset:0; z-index:10; pointer-events:none; transition:opacity 500ms ease; }
  #hud.ui-hidden { opacity:0; }
  .hud-item { pointer-events:auto; position:absolute; text-shadow:var(--ui-shadow); }
  #worldName { left:calc(env(safe-area-inset-left) + clamp(18px,3vw,44px)); top:calc(env(safe-area-inset-top) + clamp(18px,3vw,36px)); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  #status { left:calc(env(safe-area-inset-left) + clamp(18px,3vw,44px)); bottom:calc(env(safe-area-inset-bottom) + clamp(18px,3vw,36px)); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); }
  #controls { right:calc(env(safe-area-inset-right) + clamp(14px,2.2vw,28px)); top:calc(env(safe-area-inset-top) + clamp(14px,2.2vw,28px)); display:flex; gap:8px; }
  .icon-btn { width:44px; height:44px; min-width:44px; min-height:44px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.16); background:rgba(8,10,12,.24); backdrop-filter:blur(8px); border-radius:50%; cursor:pointer; }
  .icon-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; }
  #worldBtn { right:calc(env(safe-area-inset-right) + clamp(14px,2.2vw,28px)); bottom:calc(env(safe-area-inset-bottom) + clamp(14px,2.2vw,28px)); padding:0 14px; height:44px; min-height:44px; border:1px solid rgba(255,255,255,.16); background:rgba(8,10,12,.24); backdrop-filter:blur(8px); border-radius:22px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
  #flowBtn { right:calc(env(safe-area-inset-right) + clamp(14px,2.2vw,28px)); bottom:calc(env(safe-area-inset-bottom) + 68px); padding:0 14px; height:44px; min-height:44px; border:1px solid rgba(255,255,255,.16); background:rgba(8,10,12,.24); backdrop-filter:blur(8px); border-radius:22px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }

  @media (max-width:700px) {
    #selector { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
    .world-tile { border-right:1px solid rgba(255,255,255,.10); border-bottom:1px solid rgba(255,255,255,.10); }
    .selector-brand { top:calc(env(safe-area-inset-top) + 14px); left:calc(env(safe-area-inset-left) + 16px); }
    .selector-sub { bottom:calc(env(safe-area-inset-bottom) + 12px); left:calc(env(safe-area-inset-left) + 16px); }
    #worldName { top:calc(env(safe-area-inset-top) + 16px); left:calc(env(safe-area-inset-left) + 16px); }
    #status { left:calc(env(safe-area-inset-left) + 16px); bottom:calc(env(safe-area-inset-bottom) + 16px); }
    #controls { top:calc(env(safe-area-inset-top) + 12px); right:calc(env(safe-area-inset-right) + 12px); gap:6px; }
    #worldBtn { right:calc(env(safe-area-inset-right) + 12px); bottom:calc(env(safe-area-inset-bottom) + 12px); }
    #flowBtn { right:calc(env(safe-area-inset-right) + 12px); bottom:calc(env(safe-area-inset-bottom) + 64px); }
    body.flow-active #viewer { filter:none; }
  }

  #loading { position:absolute; inset:0; z-index:40; display:grid; place-items:center; background:#050607; transition:opacity 500ms ease, visibility 500ms ease; }
  #loading.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  #loadingText { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  #dev { position:absolute; left:12px; top:12px; z-index:50; width:min(400px,calc(100vw - 24px)); padding:12px; background:rgba(0,0,0,.72); border:1px solid rgba(255,255,255,.18); font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#fff; display:none; }
  #dev.open { display:block; }
  #dev pre { white-space:pre-wrap; margin:0; }
  #dev input[type=range] { width:100%; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="selector">
    <div class="selector-brand">VIEW</div>
    <div class="selector-sub">Choose a world</div>
    <button class="world-tile" data-world="beach"><span class="tile-label">Beach</span></button>
    <button class="world-tile" data-world="veil"><span class="tile-label">Veil</span></button>
    <button class="world-tile" data-world="abyss"><span class="tile-label">Abyss</span></button>
    <button class="world-tile" data-world="orbit"><span class="tile-label">Orbit</span></button>
  </div>
  <div id="viewer">
    <canvas id="gl"></canvas>
    <div id="camWrap"><div class="scene-layer" id="layerA"></div><div class="b-band" id="bFar"></div><div class="b-band" id="bMid"></div><div class="b-band" id="bNear"></div></div>
    <div id="overlayFx"></div><div class="vignette"></div>
    <svg width="0" height="0" style="position:absolute"><filter id="metaFluidDisplace"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.015" numOctaves="2" seed="7"><animate attributeName="baseFrequency" values="0.008 0.015;0.012 0.01;0.008 0.015" dur="10s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="10"><animate attributeName="scale" values="6;15;8;12;6" dur="9s" repeatCount="indefinite"/></feDisplacementMap></filter></svg>
  </div>
  <div id="hud">
    <div id="worldName" class="hud-item">VIEW</div><div id="status" class="hud-item">Select a world</div>
    <div id="controls" class="hud-item"><button id="soundBtn" class="icon-btn" aria-label="Toggle sound"><span id="soundGlyph"></span></button><button id="pauseBtn" class="icon-btn" aria-label="Pause"><span id="pauseGlyph"></span></button></div>
    <button id="flowBtn" class="hud-item">Hyper</button><button id="worldBtn" class="hud-item">Worlds</button>
  </div>
  <div id="loading"><div id="loadingText">Preparing VIEW</div></div>
  <div id="dev"><input id="devScrub" type="range" min="0" max="1" step="0.001"/><pre id="devText"></pre></div>
</div>
<script>
/* VIEW iPhone RC hosted preview. */
(()=>{
'use strict';
const MOBILE_DEVICE = matchMedia('(pointer:coarse)').matches || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const IMG = src => src + (src.includes('?')?'&':'?') + 'auto=format&fit=crop&w=' + (MOBILE_DEVICE?1440:1920) + '&q=' + (MOBILE_DEVICE?72:82);
const WORLDS=[
{id:'beach',label:'Beach',archetype:'warm horizon',morph:26,hold:18,scenes:[{src:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e'},{src:'https://images.unsplash.com/photo-1476673160081-cf065607f449'},{src:'https://images.unsplash.com/photo-1493558103817-58b2924bce98'}]},
{id:'veil',label:'Veil',archetype:'mist field',morph:30,hold:20,scenes:[{src:'https://images.unsplash.com/photo-1483347756197-71ef80e95f73'},{src:'https://images.unsplash.com/photo-1519681393784-d120267933ba'},{src:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b'}]},
{id:'abyss',label:'Abyss',archetype:'submerged depth',morph:28,hold:22,scenes:[{src:'https://images.unsplash.com/photo-1469474968028-56623f02e42e'},{src:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee'},{src:'https://images.unsplash.com/photo-1519608487953-e999c86e7455'}]},
{id:'orbit',label:'Orbit',archetype:'orbital silence',morph:32,hold:22,scenes:[{src:'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa'},{src:'https://images.unsplash.com/photo-1446941611757-91d2c3bd3d45'},{src:'https://images.unsplash.com/photo-1451187580459-43490279c0fa'}]}
];
const cache=new Map(); const MAX_CACHE=MOBILE_DEVICE?7:12;
function loadAsset(src){const u=IMG(src); if(cache.has(u))return cache.get(u); const p=new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=u}); cache.set(u,p); if(cache.size>MAX_CACHE){const k=cache.keys().next().value;cache.delete(k)} return p;}
const UI={selector:document.getElementById('selector'),loading:document.getElementById('loading'),hud:document.getElementById('hud'),worldName:document.getElementById('worldName'),status:document.getElementById('status'),soundGlyph:document.getElementById('soundGlyph'),pauseGlyph:document.getElementById('pauseGlyph'),timer:null,init(){document.querySelectorAll('.world-tile').forEach((b,i)=>{b.style.setProperty('--tile-img',`url("${IMG(WORLDS[i].scenes[0].src)}")`);b.addEventListener('click',e=>{e.stopPropagation();Engine.enterWorld(i)})});this.updatePauseIcon()},showUI(){this.hud.classList.remove('ui-hidden');clearTimeout(this.timer);if(Engine.started)this.timer=setTimeout(()=>this.hud.classList.add('ui-hidden'),4500)},toggleUI(){this.hud.classList.toggle('ui-hidden')},showSelector(){this.selector.classList.remove('hidden');this.hud.classList.add('ui-hidden')},hideSelector(){this.selector.classList.add('hidden');this.hud.classList.remove('ui-hidden');this.showUI()},setStatus(){if(!Engine.started){this.status.textContent='Select a world';return;} this.status.textContent=Engine.paused?'Paused':(Engine.phase==='morph'?'Morphing':'Breathing')},updatePauseIcon(){this.pauseGlyph.innerHTML=Engine.paused?'<svg viewBox="0 0 24 24"><path d="M8 5l10 7-10 7z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>'}};
